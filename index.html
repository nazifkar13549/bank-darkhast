<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>بانک درخواست</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16222a;--mut:#667780;--pri:#0f4c5c;--acc:#e07a1f;--line:#e2e8ec;--ok:#1b7f4b;--warn:#b4531a}
@media(prefers-color-scheme:dark){:root{--bg:#10171b;--card:#18222828;--card:#1a252b;--ink:#e8eef1;--mut:#93a4ad;--pri:#5bb5c9;--line:#2a3941}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,"Vazirmatn","Noto Naskh Arabic",Tahoma,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:5}
@media(prefers-color-scheme:dark){header{background:#0c2f38;color:#fff}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0;font-weight:700}
.iconbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px}
form{margin-top:10px;display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;direction:ltr;text-align:left;background:#fff;color:#16222a}
input::placeholder{direction:rtl;color:#8a99a1;font-size:15px}
form button{border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;padding:0 18px}
main{padding:12px 12px 90px;max-width:760px;margin:auto}
.meta{color:var(--mut);font-size:13px;margin:4px 4px 10px}
.item{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font:inherit;color:inherit}
.item .id{direction:ltr;text-align:left;font-weight:700;color:var(--pri);font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .d{margin:2px 0;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .s{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;background:#e8f1f3;color:var(--pri);font-weight:600;direction:rtl}
.tag.sp{background:#fdeedd;color:var(--warn)}
@media(prefers-color-scheme:dark){.tag{background:#23353c}.tag.sp{background:#3b2a1b;color:#f0a35e}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sec h2{margin:0;padding:9px 14px;font-size:14px;background:rgba(15,76,92,.08);color:var(--pri)}
.sec.sp h2{background:rgba(224,122,31,.14);color:var(--warn)}
.row{padding:9px 14px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.row span{white-space:pre-line;word-break:break-word}
.row span.ltr{direction:ltr;display:inline-block}
.head{padding:4px 4px 12px}
.head .id{direction:ltr;text-align:right;font-size:22px;font-weight:800;color:var(--pri)}
.back{background:none;border:0;color:var(--pri);font:inherit;font-weight:700;padding:6px 2px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
dialog{border:0;border-radius:18px;padding:0;width:min(92vw,440px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dl{padding:18px}
.dl h3{margin:0 0 6px}
.dl p{margin:6px 0;color:var(--mut);font-size:14px}
.dl button,.dl label.btn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.dl .primary{background:var(--pri);color:#fff;border:0}
.dl input[type=file]{display:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16222a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none;max-width:90vw;text-align:center}
#upd{display:none;position:fixed;bottom:0;inset-inline:0;background:var(--acc);color:#fff;padding:12px 16px;z-index:15;text-align:center}
#upd button{margin-inline-start:10px;border:0;border-radius:8px;padding:5px 12px;font:inherit;font-weight:700}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;border:0;border-radius:10px;padding:8px 6px;font:inherit;font-size:14px;font-weight:700;background:rgba(255,255,255,.16);color:#fff}
.tabs button.on{background:#fff;color:var(--pri)}
main.wide{max-width:none}
.tbar{display:flex;gap:8px;margin-bottom:6px}
.tbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--card);color:var(--ink)}
.tbar button{border:0;border-radius:12px;background:var(--pri);color:#fff;font:inherit;font-weight:700;padding:0 14px;white-space:nowrap}
.tw{overflow:auto;max-height:calc(100vh - 250px);max-height:calc(100dvh - 250px);background:var(--card);border:1px solid var(--line);border-radius:12px}
.tw table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:1500px;width:100%}
.tw th{position:sticky;top:0;z-index:2;background:#dfeaed;color:var(--pri);padding:8px 10px;text-align:right;white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--line);font-weight:700}
.tw td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top;white-space:pre-line;min-width:80px}
.tw td.w{min-width:230px}
.tw td.l{direction:ltr;text-align:right;white-space:nowrap}
.tw tr.r{cursor:pointer}
.tw tbody tr:nth-child(even) td{background:rgba(15,76,92,.04)}
.tw th:first-child,.tw td:first-child{position:sticky;right:0;z-index:1;background:var(--card);border-left:1px solid var(--line);font-weight:700;color:var(--pri)}
.tw th:first-child{z-index:3;background:#dfeaed}
@media(prefers-color-scheme:dark){.tw th,.tw th:first-child{background:#23353c}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>بانک درخواست</h1><button class="iconbtn" id="menu" aria-label="تنظیمات">⚙</button></div>
  <form id="f"><input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="شماره تقاضا (مثلاً mt31_0546534 یا 0546534)"><button>جستجو</button></form>
  <div class="tabs"><button id="tS" class="on">جستجو</button><button id="tT">جدول پیگیری ویژه</button></div>
</header>
<main id="main"></main>
<div id="toast"></div>
<div id="upd">نسخه جدید برنامه آماده است <button id="updbtn">به‌روزرسانی</button></div>
<dialog id="dlg"><div class="dl">
  <h3>به‌روزرسانی و تنظیمات</h3>
  <p id="info"></p>
  <button class="primary" id="chk">بررسی به‌روزرسانی آنلاین</button>
  <label class="btn">انتخاب فایل اکسل جدید (xlsx)<input type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>
  <button id="reset">بازگشت به داده‌ی پیش‌فرض برنامه</button>
  <button id="close">بستن</button>
  <p>با انتخاب فایل اکسل، شیت اول و دوم خوانده می‌شود و روی همین دستگاه ذخیره می‌گردد؛ بدون نیاز به اینترنت.</p>
</div></dialog>
<script src="xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
